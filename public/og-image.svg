<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Content -->
  <g>
    <!-- Title -->
    <text x="600" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
      Vibe Control
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="320" font-family="Arial, sans-serif" font-size="36" fill="rgba(255,255,255,0.9)" text-anchor="middle">
      Playlist Collaborative pour Soirées
    </text>
    
    <!-- Description -->
    <text x="600" y="400" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)" text-anchor="middle">
      Vos invités suggèrent, vous validez
    </text>
    
    <!-- Icon/Logo placeholder (music note) -->
    <circle cx="600" cy="500" r="40" fill="rgba(255,255,255,0.2)"/>
    <text x="600" y="520" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle">
      ♪
    </text>
  </g>
</svg>
